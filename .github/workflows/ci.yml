name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  # clang-format must match the version developers run. Ubuntu ships 18, and 19
  # changed pointer-to-member spacing, so the two disagree on code that is clean
  # locally. Pin it to the compiler version from profiles/linux-clang.
  format:
    runs-on: ubuntu-24.04
    # The last line of defence. A stalled command is killed on silence long
    # before this, so reaching it means something else went wrong. A working but
    # slow install has taken 912s on this runner, so this is generous on purpose.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 19
        run: |
          # apt.llvm.org is a third-party mirror and it stalls more than the
          # Ubuntu archive does, so both of these are wrapped as well. The first
          # version of this hardening wrapped only apt-get, and the job hung
          # here instead.
          .github/scripts/retry.sh 90 'wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null'
          # The source is written directly rather than through
          # add-apt-repository, which runs an apt-get update of its own. Killing
          # that on a timeout left the update alive and holding the apt lock,
          # and every later attempt then failed at once. apt-install.sh does the
          # update, once, where it can be retried.
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list > /dev/null
          .github/scripts/apt-install.sh clang-format-19
      - name: Check formatting
        run: |
          files=$(find src apps tests -name '*.cpp' -o -name '*.h' | grep -v '/version\.h$')
          clang-format-19 --dry-run --Werror $files

  # Doxygen runs with WARN_IF_UNDOCUMENTED and WARN_AS_ERROR, so an undocumented
  # public entity or a mismatched @param fails this job. It needs no compiler and
  # no dependencies, so it runs on its own and reports quickly.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: .github/scripts/apt-install.sh doxygen graphviz
      - name: Build docs
        run: |
          cmake -S . -B build-docs -DCAMINA_DOCS_ONLY=ON
          cmake --build build-docs --target docs

  # Rule 4.1 in DESIGN.md, and the Box3D rule in section 5. This runs on its own
  # so that a violation is obvious in the checks list. It also reports when the
  # build fails. Both steps run, because one violation must not hide the other.
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Vulkan containment
        run: bash scripts/check-vulkan-containment.sh .
      - name: Check Box3D containment
        if: ${{ !cancelled() }}
        run: bash scripts/check-box3d-containment.sh .
      - name: Check miniaudio containment
        if: ${{ !cancelled() }}
        run: bash scripts/check-miniaudio-containment.sh .

  # The engine targets Clang on Linux and MSVC on Windows. See DESIGN.md
  # section 2. Every step below runs under bash, including on Windows, so that
  # one script serves both legs.
  # clang-tidy, over the whole tree, without compiling it. It used to run inside
  # the Linux build through CMAKE_CXX_CLANG_TIDY, which made that build take
  # about twice as long as the same build on MSVC and held the test results
  # behind the lint.
  #
  # It lints the editor configuration, which is the superset: rule 4.3 says
  # WITH_EDITOR removes code and never changes it, so a file compiled with the
  # editor off is also compiled with it on. with_ui is on for the same reason.
  #
  # **This does not run on a pull request.** It takes about nine minutes against
  # about six for a build, so it set the pace of every review for the thing that
  # was wanted least. It runs on a push to main, where nobody waits on it, and on
  # request from the Actions tab.
  #
  # The gate has not gone. `cmake/ClangTidy.cmake` still turns clang-tidy on for
  # a Debug build and for `build/tidy`, which is what CLAUDE.md says to run
  # before a push. This job is the backstop rather than the gate.
  #
  # To put it back on pull requests, delete the `if:` below.
  lint:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          .github/scripts/apt-install.sh ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev

      - name: Install LLVM 19
        run: |
          .github/scripts/retry.sh 90 'wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null'
          # The source is written directly rather than through
          # add-apt-repository, which runs an apt-get update of its own. Killing
          # that on a timeout left the update alive and holding the apt lock,
          # and every later attempt then failed at once. apt-install.sh does the
          # update, once, where it can be retried.
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list > /dev/null
          .github/scripts/apt-install.sh clang-19 clang-tidy-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Add the moth_ui remote
        run: |
          conan remote add --force artifactory \
            https://artifactory.matthewcotton.net/artifactory/api/conan/conan-local

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-linux-clang-uitrue-editortrue-${{ hashFiles('conanfile.py') }}
          # The same packages the editor build job uses, so the two share a
          # cache rather than each building the tree from source.
          restore-keys: |
            conan-linux-clang-uitrue-editortrue-
            conan-linux-clang-uitrue-
            conan-linux-clang-

      # The same two settings the Linux build jobs pass. Conan defaults
      # tools.system.package_manager:mode to "check", so xorg/system stops and
      # asks a user to install its packages. There is no user on a runner, and
      # leaving these out fails the conan install rather than the lint.
      - name: Conan install
        run: |
          conan install . -pr:h profiles/linux-clang -pr:b profiles/linux-clang \
            -b missing -o "&:with_ui=True" -o "&:with_editor=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      # Configure only, so this job never pays for a compile.
      #
      # **CMAKE_CXX_SCAN_FOR_MODULES=OFF is what makes that possible.** With
      # Ninja and C++20, CMake puts an `@...o.modmap` on every compile line, and
      # that file is written by the build rather than by the configure. Linting
      # an unbuilt tree then fails with "no such file or directory" on every
      # translation unit. This project uses no C++20 module, so the scan buys
      # nothing here. It stays on for the build jobs, which do build.
      - name: Configure
        run: |
          cmake --preset conan-relwithdebinfo \
            -DENGINE_ENABLE_CLANG_TIDY=OFF \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Lint
        run: .github/scripts/lint.sh build/RelWithDebInfo

  # AddressSanitizer and UndefinedBehaviorSanitizer, over the whole test suite.
  #
  # Issue #450 is why this exists. A heap use-after-free in the mixer went
  # unfound for months. Windows CI failed about one run in six, and the cause
  # read as a flaky runner. AddressSanitizer named it in one run, with the
  # allocation, the free and the read all pointing at three lines of one
  # function.
  #
  # **This does not run on a pull request**, the same as the lint job above and
  # for the same reason: a sanitized build and a sanitized test suite are both
  # slower than the plain ones, and a review should not wait on them. It runs on
  # a push to main and on request from the Actions tab. So a green pull request
  # says nothing about the sanitizer.
  #
  # Linux with Clang only. MSVC has an AddressSanitizer of its own, under a
  # different flag, with a runtime DLL to ship and no UndefinedBehaviorSanitizer
  # at all. That is a separate piece of work.
  #
  # It builds the editor configuration, which is the superset, for the reason
  # the lint job gives: rule 4.3 says WITH_EDITOR removes code and never changes
  # it, so a file compiled with the editor off is also compiled with it on.
  sanitize:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # A sanitized build is about as long as a plain one and a sanitized test run
    # is several times longer, so this is generous against the 45 the build jobs
    # take.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          .github/scripts/apt-install.sh ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev

      - name: Install LLVM 19
        run: |
          .github/scripts/retry.sh 90 'wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null'
          # The source is written directly rather than through
          # add-apt-repository, which runs an apt-get update of its own. Killing
          # that on a timeout left the update alive and holding the apt lock,
          # and every later attempt then failed at once. apt-install.sh does the
          # update, once, where it can be retried.
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list > /dev/null
          .github/scripts/apt-install.sh clang-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Add the moth_ui remote
        run: |
          conan remote add --force artifactory \
            https://artifactory.matthewcotton.net/artifactory/api/conan/conan-local

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          # The same key the editor build job and the lint job use. The
          # dependencies are not sanitized, so they are the same packages and
          # the three jobs share one cache. Only this project carries the flags.
          key: conan-linux-clang-uitrue-editortrue-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-linux-clang-uitrue-editortrue-
            conan-linux-clang-uitrue-
            conan-linux-clang-

      - name: Conan install
        run: |
          conan install . -pr:h profiles/linux-clang -pr:b profiles/linux-clang \
            -b missing -o "&:with_ui=True" -o "&:with_editor=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      # clang-tidy is off, the same as in the build jobs. The lint job runs it.
      - name: Configure
        run: |
          cmake --preset conan-relwithdebinfo \
            -DENGINE_SANITIZERS=address,undefined \
            -DENGINE_ENABLE_CLANG_TIDY=OFF

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      # print_stacktrace is what turns an UndefinedBehaviorSanitizer report from
      # one line into something a person can act on. cmake/Sanitizers.cmake
      # already builds with -fno-sanitize-recover, so a finding aborts the test
      # rather than printing into a log nobody reads.
      #
      # -LE gpu leaves out the one check that needs a device, the same as the
      # build jobs.
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset conan-relwithdebinfo --output-on-failure -LE gpu

  build:
    name: build (${{ matrix.profile }}, ui=${{ matrix.with_ui }}, editor=${{ matrix.with_editor }}, lua=${{ matrix.with_lua }})
    runs-on: ${{ matrix.os }}
    # A healthy build is 14 to 19 minutes, so this fails a hung one without
    # cutting a slow one short. See .github/scripts/apt-install.sh.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # M8 shipped with_lua as an option and no job ever turned it off, so
          # it stopped building and nobody heard for five milestones. #288.
          # It rides this leg rather than a job of its own, the same way M9.1
          # put the editor on the two legs below: the leg that already drops
          # every optional part is the one that should drop this too.
          - os: ubuntu-24.04
            profile: linux-clang
            with_ui: false
            with_editor: false
            with_lua: false
            # The xorg/system recipe needs about 35 X11 and XCB development
            # packages. Conan defaults tools.system.package_manager:mode to
            # "check", so it stops and asks the user to install them. On a
            # runner there is no user, so let Conan install them with sudo. Do
            # not put this in the profiles. A local build must not install
            # system packages on its own.
            conan_conf: >-
              -c tools.system.package_manager:mode=install
              -c tools.system.package_manager:sudo=True
          - os: windows-2022
            profile: windows-msvc
            with_ui: false
            with_editor: false
            with_lua: true
            conan_conf: ""
          # Game UI on, so src/ui and moth_ui are compiled. Both platforms,
          # because each catches something the other cannot. Linux runs
          # clang-tidy, which the MSVC job skips. Windows is the only MSVC
          # compile of src/ui anywhere, and no developer here has a Windows
          # machine to try it on. See issue #201.
          #
          # M9.1 turns the editor on in these two legs rather than in two legs
          # of its own. apps/editor was missing for eight milestones and
          # with_editor=True did not even configure, because no job ever turned
          # it on. It costs one more executable here and no extra job, and it
          # covers both compilers. The legs above keep the option off, so a
          # release build that drops the editor is still built every run.
          - os: ubuntu-24.04
            profile: linux-clang
            with_ui: true
            with_editor: true
            with_lua: true
            conan_conf: >-
              -c tools.system.package_manager:mode=install
              -c tools.system.package_manager:sudo=True
          - os: windows-2022
            profile: windows-msvc
            with_ui: true
            with_editor: true
            with_lua: true
            conan_conf: ""

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt-install.sh ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev

      # The clang profile pins compiler.version=19, and the runner ships an older
      # clang. Install the matching toolchain and clang-tidy from apt.llvm.org.
      # cmake/ClangTidy.cmake fails the build in CI when clang-tidy is missing.
      - name: Install LLVM 19
        if: runner.os == 'Linux'
        run: |
          .github/scripts/retry.sh 90 'wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null'
          # The source is written directly rather than through
          # add-apt-repository, which runs an apt-get update of its own. Killing
          # that on a timeout left the update alive and holding the apt lock,
          # and every later attempt then failed at once. apt-install.sh does the
          # update, once, where it can be retried.
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list > /dev/null
          .github/scripts/apt-install.sh clang-19 clang-tidy-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          # No alternative for clang-tidy. This runner already carries one that
          # this priority does not outrank, so the line looked right and did
          # nothing. cmake/ClangTidy.cmake asks for clang-tidy-19 by name, and
          # it refuses to configure when that binary rejects the config.

      # The windows profile asks for the Ninja generator, so cl.exe and the
      # Windows SDK must be on PATH before CMake runs. This action calls
      # vcvars64.bat and exports the result to the later steps.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      # moth_ui is not on Conan Center. conanfile.py pins it, and this remote
      # serves it. Anonymous read, so there is no secret here. A job with the
      # option off never resolves moth_ui and does not need this.
      #
      # HTTPS rather than plain HTTP. A package fetched here is compiled and
      # linked into the engine, so anybody able to answer for that host could
      # choose what this build runs.
      - name: Add the moth_ui remote
        if: matrix.with_ui
        run: |
          conan remote add --force artifactory \
            https://artifactory.matthewcotton.net/artifactory/api/conan/conan-local

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.profile }}-ui${{ matrix.with_ui }}-editor${{ matrix.with_editor }}-${{ hashFiles('conanfile.py') }}
          # Fall back to the same profile with the other option state. The
          # packages live under ~/.conan2/p keyed by package id, so sharing is
          # safe and the unused ones simply sit there. Without this fallback a
          # new key starts cold and builds the whole dependency tree from
          # source, which is how the first run of this job failed.
          restore-keys: |
            conan-${{ matrix.profile }}-ui${{ matrix.with_ui }}-editor${{ matrix.with_editor }}-
            conan-${{ matrix.profile }}-ui${{ matrix.with_ui }}-
            conan-${{ matrix.profile }}-

      - name: Conan install
        run: |
          conan install . -pr:h profiles/${{ matrix.profile }} \
            -pr:b profiles/${{ matrix.profile }} -b missing \
            -o "&:with_ui=${{ matrix.with_ui && 'True' || 'False' }}" \
            -o "&:with_editor=${{ matrix.with_editor && 'True' || 'False' }}" \
            -o "&:with_lua=${{ matrix.with_lua && 'True' || 'False' }}" \
            ${{ matrix.conan_conf }}

      # clang-tidy is off here and runs in the lint job instead. It used to run
      # inside this compile, which made a Linux build take about twice as long
      # as the same build on MSVC. A build says whether the code compiles and
      # the tests pass, and it no longer waits for the lint to say so.
      - name: Configure
        run: cmake --preset conan-relwithdebinfo -DENGINE_ENABLE_CLANG_TIDY=OFF

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      - name: Test
        # -LE gpu leaves out the one check that needs a device. A runner has no
        # GPU, so it would skip itself anyway, but a runner that grew a software
        # rasterizer would start checking pixels that are those of no real
        # driver. README.md gives the reason that stays true either way.
        run: ctest --preset conan-relwithdebinfo --output-on-failure -LE gpu
