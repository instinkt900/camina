name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  # clang-format must match the version developers run. Ubuntu ships 18, and 19
  # changed pointer-to-member spacing, so the two disagree on code that is clean
  # locally. Pin it to the compiler version from profiles/linux-clang.
  format:
    runs-on: ubuntu-24.04
    # A hung runner must fail rather than sit, but not before the retries have
    # run. The worst case here is 2x60 + 2x120 + 3x(90+180) = 1170s of stalling.
    # See .github/scripts/retry.sh.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 19
        run: |
          # apt.llvm.org is a third-party mirror and it stalls more than the
          # Ubuntu archive does, so both of these are wrapped as well. The first
          # version of this hardening wrapped only apt-get, and the job hung
          # here instead.
          .github/scripts/retry.sh 60 'wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null'
          .github/scripts/retry.sh 120 'sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"'
          .github/scripts/apt-install.sh clang-format-19
      - name: Check formatting
        run: |
          files=$(find src apps tests -name '*.cpp' -o -name '*.h' | grep -v '/version\.h$')
          clang-format-19 --dry-run --Werror $files

  # Doxygen runs with WARN_IF_UNDOCUMENTED and WARN_AS_ERROR, so an undocumented
  # public entity or a mismatched @param fails this job. It needs no compiler and
  # no dependencies, so it runs on its own and reports quickly.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: .github/scripts/apt-install.sh doxygen graphviz
      - name: Build docs
        run: |
          cmake -S . -B build-docs -DCAMINA_DOCS_ONLY=ON
          cmake --build build-docs --target docs

  # Rule 4.1 in DESIGN.md, and the Box3D rule in section 5. This runs on its own
  # so that a violation is obvious in the checks list. It also reports when the
  # build fails. Both steps run, because one violation must not hide the other.
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Vulkan containment
        run: bash scripts/check-vulkan-containment.sh .
      - name: Check Box3D containment
        if: ${{ !cancelled() }}
        run: bash scripts/check-box3d-containment.sh .

  # The engine targets Clang on Linux and MSVC on Windows. See DESIGN.md
  # section 2. Every step below runs under bash, including on Windows, so that
  # one script serves both legs.
  build:
    name: build (${{ matrix.profile }}, ui=${{ matrix.with_ui }}, editor=${{ matrix.with_editor }})
    runs-on: ${{ matrix.os }}
    # A healthy build is 14 to 19 minutes, so this fails a hung one without
    # cutting a slow one short. See .github/scripts/apt-install.sh.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-clang
            with_ui: false
            with_editor: false
            # The xorg/system recipe needs about 35 X11 and XCB development
            # packages. Conan defaults tools.system.package_manager:mode to
            # "check", so it stops and asks the user to install them. On a
            # runner there is no user, so let Conan install them with sudo. Do
            # not put this in the profiles. A local build must not install
            # system packages on its own.
            conan_conf: >-
              -c tools.system.package_manager:mode=install
              -c tools.system.package_manager:sudo=True
          - os: windows-2022
            profile: windows-msvc
            with_ui: false
            with_editor: false
            conan_conf: ""
          # Game UI on, so src/ui and moth_ui are compiled. Both platforms,
          # because each catches something the other cannot. Linux runs
          # clang-tidy, which the MSVC job skips. Windows is the only MSVC
          # compile of src/ui anywhere, and no developer here has a Windows
          # machine to try it on. See issue #201.
          #
          # M9.1 turns the editor on in these two legs rather than in two legs
          # of its own. apps/editor was missing for eight milestones and
          # with_editor=True did not even configure, because no job ever turned
          # it on. It costs one more executable here and no extra job, and it
          # covers both compilers. The legs above keep the option off, so a
          # release build that drops the editor is still built every run.
          - os: ubuntu-24.04
            profile: linux-clang
            with_ui: true
            with_editor: true
            conan_conf: >-
              -c tools.system.package_manager:mode=install
              -c tools.system.package_manager:sudo=True
          - os: windows-2022
            profile: windows-msvc
            with_ui: true
            with_editor: true
            conan_conf: ""

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt-install.sh ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev

      # The clang profile pins compiler.version=19, and the runner ships an older
      # clang. Install the matching toolchain and clang-tidy from apt.llvm.org.
      # cmake/ClangTidy.cmake fails the build in CI when clang-tidy is missing.
      - name: Install LLVM 19
        if: runner.os == 'Linux'
        run: |
          .github/scripts/retry.sh 60 'wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null'
          .github/scripts/retry.sh 120 'sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"'
          .github/scripts/apt-install.sh clang-19 clang-tidy-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          # No alternative for clang-tidy. This runner already carries one that
          # this priority does not outrank, so the line looked right and did
          # nothing. cmake/ClangTidy.cmake asks for clang-tidy-19 by name, and
          # it refuses to configure when that binary rejects the config.

      # The windows profile asks for the Ninja generator, so cl.exe and the
      # Windows SDK must be on PATH before CMake runs. This action calls
      # vcvars64.bat and exports the result to the later steps.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      # moth_ui is not on Conan Center. conanfile.py pins it, and this remote
      # serves it. Anonymous read, so there is no secret here. A job with the
      # option off never resolves moth_ui and does not need this.
      #
      # HTTPS rather than plain HTTP. A package fetched here is compiled and
      # linked into the engine, so anybody able to answer for that host could
      # choose what this build runs.
      - name: Add the moth_ui remote
        if: matrix.with_ui
        run: |
          conan remote add --force artifactory \
            https://artifactory.matthewcotton.net/artifactory/api/conan/conan-local

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.profile }}-ui${{ matrix.with_ui }}-editor${{ matrix.with_editor }}-${{ hashFiles('conanfile.py') }}
          # Fall back to the same profile with the other option state. The
          # packages live under ~/.conan2/p keyed by package id, so sharing is
          # safe and the unused ones simply sit there. Without this fallback a
          # new key starts cold and builds the whole dependency tree from
          # source, which is how the first run of this job failed.
          restore-keys: |
            conan-${{ matrix.profile }}-ui${{ matrix.with_ui }}-editor${{ matrix.with_editor }}-
            conan-${{ matrix.profile }}-ui${{ matrix.with_ui }}-
            conan-${{ matrix.profile }}-

      - name: Conan install
        run: |
          conan install . -pr:h profiles/${{ matrix.profile }} \
            -pr:b profiles/${{ matrix.profile }} -b missing \
            -o "&:with_ui=${{ matrix.with_ui && 'True' || 'False' }}" \
            -o "&:with_editor=${{ matrix.with_editor && 'True' || 'False' }}" \
            ${{ matrix.conan_conf }}

      - name: Configure
        run: cmake --preset conan-relwithdebinfo

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo

      - name: Test
        run: ctest --preset conan-relwithdebinfo --output-on-failure
